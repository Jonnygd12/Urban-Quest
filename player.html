<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Urban Quest Player</title><link rel="stylesheet" href="app.css"></head>
<body><div class="app"><div class="top"><div id="brand" class="brand">URBAN QUEST</div><div class="actions"><button id="gps" class="pill">📍 GPS</button><button id="around" class="pill">👀 Around me</button><div id="score" class="pill">0 pts</div></div></div>
<section id="home" class="screen active"><div class="hero"><div id="emoji" style="font-size:52px"></div><h1 id="title"></h1><p id="subtitle" class="muted"></p><div class="stats"><div class="stat"><strong id="stopStat"></strong><span class="tiny muted">stops</span></div><div class="stat"><strong id="mileStat"></strong><span class="tiny muted">planned</span></div><div class="stat"><strong>Mystery</strong><span class="tiny muted">clues</span></div></div></div><div class="card"><button id="start" class="primary">Start quest</button><button id="galleryHome" class="secondary">📸 Photo log</button><button id="reset" class="secondary">Reset progress</button></div></section>
<section id="mission" class="screen"><div class="card"><div class="tiny muted">CURRENT STOP <span id="stopNo"></span></div><h1 id="stopName"></h1><p id="intro" class="muted"></p><div id="location" class="result">GPS not started.</div><div style="display:flex;justify-content:space-between;margin-top:12px"><strong>Tasks</strong><span id="taskCount"></span></div><div class="progress"><div id="stopFill" class="fill"></div></div></div><div id="mainTasks"></div><div class="card"><button id="bonusToggle" class="warn">🔍 Reveal hidden challenges</button><div id="bonusTasks" class="hidden"></div><button id="fact" class="secondary">👀 Tell me about this place</button><div id="factBox" class="hidden fact"></div></div><div class="card"><h3>📸 Mission photos</h3><p id="photoPrompt" class="muted"></p><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><div id="photoStatus" class="photo-status"></div><div id="photos" class="photo-grid"></div><button id="confirm" type="button" class="good" disabled>Confirm stop complete</button><div class="grid"><button id="prev" class="secondary">← Previous</button><button id="breaks" class="warn">☕ Need a break?</button></div><button id="overview" class="secondary">Quest overview</button></div></section>
<section id="summary" class="screen"><div class="hero"><div style="font-size:58px">🎉</div><h1>Stop complete</h1><p id="summaryText"></p><div id="clueBox" class="fact"></div><div id="earned"></div><button id="next" type="button" class="primary">Continue</button><button id="return" type="button" class="secondary">← Return</button></div></section>
<section id="overviewScreen" class="screen"><div class="card"><h1>Quest overview</h1><p id="overallText" class="muted"></p><div class="progress"><div id="overallFill" class="fill"></div></div><div id="route"></div><button id="resume" class="primary">Resume</button><button id="galleryBtn" class="secondary">📸 Photo log</button></div></section>
<section id="gallery" class="screen"><div class="card"><h1>📸 Mission log</h1><div id="galleryGrid" class="photo-grid"></div><button id="galleryBack" class="primary">Back</button></div></section>
<section id="finish" class="screen"><div class="hero"><div style="font-size:60px">🏆</div><h1 id="finishTitle"></h1><div id="grade" class="grade"></div><p id="finishMessage"></p><div id="dossier" class="dossier"></div><button id="print" class="good no-print">🗂️ Print or save dossier</button><button id="finishGallery" class="secondary no-print">📸 Photos</button></div></section></div>
<div id="aroundOverlay" class="overlay"><div class="sheet"><h2>👀 Around me</h2><div id="aroundResult" class="result">Start GPS first.</div><button id="aroundRefresh" class="primary">Refresh</button><button id="aroundClose" class="secondary">Close</button></div></div>
<div id="breakOverlay" class="overlay"><div class="sheet"><h2>Need a break?</h2><div class="grid"><button class="secondary" data-break="toilets">🚻 Toilets</button><button class="secondary" data-break="cafe">☕ Café</button><button class="secondary" data-break="restaurant">🍕 Food</button><button class="secondary" data-break="bench">🪑 Sit down</button></div><div id="breakResult"></div><button id="breakClose" class="secondary">Close</button></div></div>
<script src="player.js"></script></body></html>
